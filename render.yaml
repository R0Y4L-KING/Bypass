services:
  - type: web
    name: bypass-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: KEY
        sync: false
      - key: BOT_USERNAME
        value: KingBypassRobot
      - key: FSUB_CHANNELS
        value: "@ModAppsKing,@EduAppsKing"
      - key: FSUB_PIC
        value: https://raw.githubusercontent.com/R0Y4L-KING/Bypass/main/assets/fsub-banner.jpg
      - key: PYTHON_VERSION
        value: 3.12.6
