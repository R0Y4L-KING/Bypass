services:
  - type: web
    name: bypass-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: KEY
        sync: false
      - key: BOT_USERNAME
        value: KingBypassRobot
      - key: FSUB_CHANNELS
        sync: false
